name: Android APK and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: certificate-generator-v1.3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish v1.3 GitHub Release
        if: contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: SoloDefStudio Certificate Generator 1.3
          target_commitish: ${{ github.sha }}
          body: |
            Версия 1.3.

            Добавлена автоматическая проверка обновлений при запуске приложения.

            Добавлены готовые шаблоны по референсам: патриотический, современный конкурсный, классический красно-золотой, чёрно-золотой и Lash Master.

            APK подписан временным debug-ключом CI. Подпись APK пока использует CI debug-ключ; если Android обнаружит несовпадение подписи, обновление поверх старой установки будет отклонено.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
